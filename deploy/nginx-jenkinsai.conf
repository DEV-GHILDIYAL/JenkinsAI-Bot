# Install as /etc/nginx/conf.d/jenkinsai.conf. Jenkins remains on :8080.
# Reach this private gateway using ssh -L 8090:127.0.0.1:8090 ...
# Requires nginx http_sub_module and http_auth_request_module.
# Render the token placeholder server-side; never serve this template directly.
map $http_upgrade $jenkinsai_connection {
    default upgrade;
    '' '';
}

server {
    listen 127.0.0.1:8090;
    server_name localhost;
    access_log off;

    location = /assistant { return 302 /assistant/; }
    location = /__jenkinsai_auth {
        internal;
        proxy_pass http://127.0.0.1:8080/api/json;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $http_host;
    }
    location @jenkinsai_signin {
        default_type application/json;
        return 401 '{"detail":"Sign in to Jenkins, then refresh this page."}';
    }
    location /assistant/api/ {
        auth_request /__jenkinsai_auth;
        error_page 401 403 = @jenkinsai_signin;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Authorization "Bearer __ASSISTANT_TOKEN__";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 128k;
        proxy_read_timeout 120s;
    }
    location /assistant/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 128k;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jenkinsai_connection;
        proxy_set_header Accept-Encoding "";
        proxy_redirect http://127.0.0.1:8080/ /;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        # Inject only into HTML responses. Load the widget on every Jenkins page.
        sub_filter '</body>' '<script src="/assistant/static/widget.js"></script></body>';
        sub_filter_once on;
    }
}
