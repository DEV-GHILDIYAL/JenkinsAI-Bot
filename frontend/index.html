<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JenkinsAI · Console inspector</title>
  <style>
    :root{color-scheme:light dark;font:16px/1.6 system-ui,sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fa;color:#1f2937}
    main{max-width:560px;padding:32px;margin:20px;background:#fff;border:1px solid #dce3ec;border-radius:16px;box-shadow:0 12px 35px #0001}
    h1{font-size:28px;margin:0 0 8px}p{margin:8px 0;color:#4b5563}a{color:#2875b9}
    @media(prefers-color-scheme:dark){body{background:#111821;color:#f1f5f9}main{background:#202c3b;border-color:#405166}p{color:#afc0d3}a{color:#73c5ff}}
  </style>
</head>
<body><main><h1>🤖 JenkinsAI</h1><p>Open a build’s <strong>Console Output</strong> in Jenkins. A small popup will analyze that build automatically, even when Jenkins marks it successful.</p><p>The popup shows the result, one evidence line, and the next step. It appears only on Console Output pages.</p><p><a href="/">Back to Jenkins</a></p></main></body>
</html>
